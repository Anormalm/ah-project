extends: jetson_orin_nx_sota.yaml

depth:
  enabled: true
  min_m: 0.3
  max_m: 6.0
  min_valid_fraction: 0.2

# Direct USB RGB-D preparation profile. This bypasses the RTSP/NVDEC ingestion
# path but retains the same TensorRT pose, tracking, rules and output stack.
streams:
  - stream_id: jetson_d435i
    type: realsense
    # Use "auto" for one camera, or replace with the device serial number.
    source: auto

ingestion:
  realsense:
    # Long-range profile: retain more RGB detail for the 960px pose engine,
    # while using the D435i's stable VGA depth mode and aligning it to color.
    color_width: 1280
    color_height: 720
    depth_width: 640
    depth_height: 480
    fps: 15
    frame_timeout_ms: 1000
    # Camera IMU is disabled initially; it measures camera motion, not patients.
    enable_imu: false

features:
  # Torso-center smoothing protects pixel derivatives from keypoint jitter at
  # the D435i's 30 FPS capture rate while retaining fast fall motion.
  center_ema_alpha: 0.25

pose:
  # Use the validated engine until the optional 960px long-range export exists.
  model_path: models/yolo26s-pose-fp16-640.engine
  input_size: 640

rules:
  # Reject fragmentary skeletons as a fall source when a person crosses the
  # near/right image boundary. Full-body standing poses currently score >0.7.
  fall_min_pose_quality: 0.55

output:
  json_log_path: output/alerts_jetson_d435i.jsonl
  # Local debugging only. The dashboard starts anonymized after every restart.
  allow_privacy_toggle: true
