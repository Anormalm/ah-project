logging:
  level: INFO

pipeline:
  device: cuda:0
  require_accelerator: true
  allow_cpu_fallback: false
  warmup_models: true
  reject_duplicate_inference: true
  share_inference_backends: true
  fps: 15
  buffer_size: 1
  max_frames: null
  metrics_interval_sec: 3
  sequence_len: 32

ingestion:
  rtsp_reconnect_sec: 2.0
  rtsp_max_retries: 5
  rtsp_runtime_reconnect: true
  rtsp_runtime_max_retries: null
  rtsp_use_jetson_gstreamer: true
  rtsp_codec: h264
  rtsp_transport: tcp
  rtsp_latency_ms: 100

streams:
  - stream_id: jetson_sota_camera
    type: rtsp
    source: ${AH_RTSP_URL}

# YOLO26s-pose gives the balanced single-camera accuracy profile. Detection is
# produced by the pose model so the frame is inferred only once.
detection:
  backend: none
  model_path: models/yolo26s.pt
  input_size: 640
  conf_threshold: 0.10
  person_class_id: 0

pose:
  backend: ultralytics_pose
  model_path: models/yolo26s-pose-fp16-640.engine
  input_size: 640
  conf_threshold: 0.10
  match_iou_threshold: 0.1

tracking:
  backend: pose_kalman
  iou_threshold: 0.15
  max_misses: 20
  track_high_thresh: 0.35
  track_low_thresh: 0.10
  new_track_thresh: 0.45
  pose_similarity_threshold: 0.20
  max_center_distance: 1.25
  iou_weight: 0.50
  pose_weight: 0.40
  motion_weight: 0.10
  keypoint_ema_alpha: 0.70

features:
  min_keypoint_conf: 0.25
  bed_zones: []

rules:
  bed_edge_distance_px: 40.0
  sitting_edge_seconds: 5.0
  sudden_drop_vy: 220.0
  sudden_drop_ay: 1100.0
  lean_angle_deg: 30.0
  lean_std_deg: 8.0
  inactivity_speed_px_s: 8.0
  inactivity_seconds: 20.0
  transition_window_sec: 15.0
  transition_threshold: 4
  enable_sitting_edge_rule: false
  enable_fall_rule: true
  enable_lean_instability_rule: true
  enable_inactivity_rule: true
  enable_transition_rule: true

# Keep this safety profile runnable before a site-specific temporal checkpoint
# exists. Switch to jetson_orin_nx_sota_stgcn.yaml after curated validation.
temporal_model:
  backend: heuristic
  model_path: models/temporal_stgcn.pt
  infer_interval: 2
  min_infer_steps: 8
  min_pose_quality: 0.25

risk:
  ml_weight: 0.15
  medium_threshold: 0.65
  high_threshold: 0.90
  critical_threshold: 0.97
  allow_ml_level_override: false
  ema_alpha: 0.20
  downgrade_grace_sec: 3.0
  high_consecutive_frames: 4
  critical_consecutive_frames: 2

output:
  json_log_path: output/alerts_jetson_sota.jsonl
  training_log_path: null
  enable_rest_api: true
  rest_api_host: 127.0.0.1
  rest_api_port: 8000
  alert_suppression:
    emit_on_level_change_only: true
    dedupe_window_sec: 2.0
  async_writer:
    alert_queue_size: 2048
    alert_batch_size: 64
    training_queue_size: 4096
    training_batch_size: 128
    frame_queue_size: 2
  live_stream:
    enabled: true
    fps: 8
    jpeg_quality: 72
  visualization:
    enabled: false
    show_bboxes: true
    show_pose: true
    show_tracks: true
    show_risk: true
    show_bed_zones: false
    show_fps: true
    privacy_mode: person_pixelate
    privacy_pixelate_size: 18
    privacy_expand_ratio: 0.16
    keypoint_conf_threshold: 0.25
    window_scale: 1.0
    quit_key: q
    quit_keys: [q, esc]
